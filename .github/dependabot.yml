version: 2

updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: "sunday"
  open-pull-requests-limit: 5
  labels:
    - "Type: Dependency Upgrade"
    - "Priority 1: Must"
  groups:
    github-dependencies:
      update-types:
        - "patch"
        - "minor"
        - "major"

- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: "sunday"
  open-pull-requests-limit: 5
  labels:
    - "Type: Dependency Upgrade"
    - "Priority 1: Must"
  ignore:
    # asciidoctor-kroki 2.x requires Asciidoctor.js 4, which Antora doesn't bundle yet. Stay on the 0.x line.
    - dependency-name: "asciidoctor-kroki"
      update-types: ["version-update:semver-major"]
  groups:
    maven-dependencies:
      update-types:
        - "patch"
        - "minor"
        - "major"